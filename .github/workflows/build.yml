name: Build Portable Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable app
        run: npm run build:win

      - name: Create clean folder structure
        run: |
          New-Item -ItemType Directory -Path "dist\output\Locked-Browser" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "dist\output\Locked-Browser\" -Recurse -Force
        shell: pwsh

      - name: Upload artifact (zip > Locked-Browser folder > files)
        uses: actions/upload-artifact@v4
        with:
          name: Locked-Browser-Portable
          path: dist/output

      - name: Zip for release (only if tagging)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path "dist\output\Locked-Browser" -DestinationPath "dist\Locked-Browser-Portable.zip" -Force
        shell: pwsh

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Locked-Browser-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
