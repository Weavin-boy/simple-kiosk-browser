name: Build Portable Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.3)'
        required: true
        default: '1.0.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build portable app
        run: npm run build:win

      - name: Create clean folder structure
        run: |
          New-Item -ItemType Directory -Path "dist\output\Simple-Kiosk-Browser" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "dist\output\Simple-Kiosk-Browser\" -Recurse -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Simple-Kiosk-Browser-Portable
          path: dist/output

      - name: Zip for release
        run: |
          Compress-Archive -Path "dist\output\Simple-Kiosk-Browser" -DestinationPath "dist\Simple-Kiosk-Browser-Portable.zip" -Force
        shell: pwsh

      - name: Compute SHA-256
        id: sha
        run: |
          $hash = (Get-FileHash -Path "dist\Simple-Kiosk-Browser-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Simple Kiosk Browser ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body: |
            SHA-256 of Simple-Kiosk-Browser-Portable.zip:
            `${{ steps.sha.outputs.sha256 }}`
          files: dist/Simple-Kiosk-Browser-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
