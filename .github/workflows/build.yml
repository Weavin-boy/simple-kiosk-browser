name: Build Portable Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.3)'
        required: true
        default: '1.0.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build portable app
        run: npm run build:win

      - name: Create clean folder structure
        run: |
          New-Item -ItemType Directory -Path "dist\output\Locked-Browser" -Force | Out-Null
          Copy-Item -Path "dist\win-unpacked\*" -Destination "dist\output\Locked-Browser\" -Recurse -Force
        shell: pwsh

      - name: Upload artifact (zip > Locked-Browser folder > files)
        uses: actions/upload-artifact@v4
        with:
          name: Locked-Browser-Portable
          path: dist/output

      - name: Zip for release
        run: |
          Compress-Archive -Path "dist\output\Locked-Browser" -DestinationPath "dist\Locked-Browser-Portable.zip" -Force
        shell: pwsh

      - name: Compute SHA-256
        id: sha
        run: |
          $hash = (Get-FileHash -Path "dist\Locked-Browser-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Locked Browser ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body: |
            SHA-256 of Locked-Browser-Portable.zip:
            `${{ steps.sha.outputs.sha256 }}`

            Security and correctness fixes from issue #1:
            - Origin-based navigation checks (will-navigate, will-redirect, will-frame-navigate)
            - Permissions limited to the locked origin
            - Secure favicon download (https only, size limit, timeout)
            - config.json requires valid https:// URL
            - Electron fuses enabled
            - F11/F12 only active when window is focused
            - devTools disabled
            - Gamepad loop guarded against duplicates
          files: dist/Locked-Browser-Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
